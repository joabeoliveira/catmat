name: Catser Import

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: 'Caminho completo do arquivo CSV no runner (ex: /tmp/catser.csv)'
        required: true
        default: '/workspace/catser.csv'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Executando import: ${{ github.event.inputs.csv_path }}"
          npm run import:catser "${{ github.event.inputs.csv_path }}"
